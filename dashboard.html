<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard | Community Problem Platform</title>
<link rel="icon" href="images/logo.svg">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="sidebar" class="sidebar"></div>
<div class="app-main">
  <header class="topbar"><button class="menu-btn" id="menuBtn" aria-label="Menu"><i class="bi bi-list"></i></button>
  <h1 id="pageTitle">Dashboard</h1><div class="chip" id="userChip"></div></header>
  <main class="content">

<div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
  <div><h2 id="welcome" class="fw-bold mb-0" style="color:var(--navy)">Welcome</h2>
  <div class="muted">Here is the status of the problems you have reported.</div></div>
  <a href="report.html" class="btn btn-green"><i class="bi bi-plus-circle me-1"></i>Report New Problem</a>
</div>
<div class="row g-3 mb-4" id="stats"></div>
<div class="card-x"><h5 class="fw-bold mb-3">Recent Complaints</h5>
<div class="table-responsive"><table class="table table-hover mb-0"><thead><tr><th>ID</th><th>Title</th><th>Category</th><th>Status</th><th style="min-width:120px">Progress</th><th></th></tr></thead>
<tbody id="recent"><tr><td colspan="6" class="muted">Loading…</td></tr></tbody></table></div></div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script src="js/dashboard.js"></script>
</body></html>
