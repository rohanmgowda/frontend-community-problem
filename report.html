<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Report a Problem | Community Problem Platform</title>
<link rel="icon" href="images/logo.svg">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="sidebar" class="sidebar"></div>
<div class="app-main">
  <header class="topbar"><button class="menu-btn" id="menuBtn" aria-label="Menu"><i class="bi bi-list"></i></button>
  <h1 id="pageTitle">Report a Problem</h1><div class="chip" id="userChip"></div></header>
  <main class="content">

<div class="row justify-content-center"><div class="col-xl-9">
<form id="reportForm" class="card-x" novalidate>
  <h4 class="fw-bold mb-1" style="color:var(--navy)">Report a community problem</h4>
  <p class="muted">Describe the issue. Our model suggests a category automatically &mdash; you can correct it.</p>
  <input type="hidden" name="predicted_category"><input type="hidden" name="prediction_confidence">
  <div class="row g-3">
    <div class="col-12"><label class="form-label fw-semibold">Complaint title</label><input class="form-control" name="title" maxlength="200" placeholder="e.g. Deep pothole near bus stand"></div>
    <div class="col-12"><label class="form-label fw-semibold">Detailed description</label><textarea class="form-control" name="description" rows="5" placeholder="What is the problem, since when, and how is it affecting people?"></textarea></div>
    <div class="col-12 d-none" id="predBox"></div>
    <div class="col-md-6"><label class="form-label fw-semibold">Problem category</label><select class="form-select" name="category"></select></div>
    <div class="col-md-6"><label class="form-label fw-semibold">Date and time</label><input type="datetime-local" class="form-control" name="incident_datetime"></div>
    <div class="col-md-8"><label class="form-label fw-semibold">Location</label>
      <div class="input-group"><input class="form-control" name="location" placeholder="Street / landmark"><button type="button" class="btn btn-outline-navy" id="geoBtn" title="Optional: add my GPS position"><i class="bi bi-crosshair"></i></button></div></div>
    <div class="col-md-4"><label class="form-label fw-semibold">Ward / area</label><input class="form-control" name="ward" placeholder="e.g. Ward 12"></div>
    <div class="col-12"><label class="form-label fw-semibold">Upload photograph</label><input type="file" class="form-control" name="photo" accept="image/png,image/jpeg,image/webp">
      <img id="preview" class="photo mt-2 d-none" alt="preview"></div>
  </div>
  <div class="small muted mt-3"><i class="bi bi-shield-lock"></i> Photos and location are visible only to you and the administrators. Reports remain <b>unverified</b> until an administrator reviews them.</div>
  <button class="btn btn-green mt-3 px-4" id="submitBtn" type="submit"><i class="bi bi-send me-1"></i>Submit complaint</button>
</form></div></div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script src="js/report.js"></script>
</body></html>
