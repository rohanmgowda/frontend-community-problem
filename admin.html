<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Dashboard | Community Problem Platform</title>
<link rel="icon" href="images/logo.svg">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="sidebar" class="sidebar"></div>
<div class="app-main">
  <header class="topbar"><button class="menu-btn" id="menuBtn" aria-label="Menu"><i class="bi bi-list"></i></button>
  <h1 id="pageTitle">Admin Dashboard</h1><div class="chip" id="userChip"></div></header>
  <main class="content">

<section id="sec-dashboard">
  <div class="row g-3 mb-4" id="aStats"></div>
  <div class="row g-3">
    <div class="col-lg-6"><div class="card-x"><h6 class="fw-bold">Complaints by category</h6><canvas id="chCat" height="200"></canvas></div></div>
    <div class="col-lg-6"><div class="card-x"><h6 class="fw-bold">Complaints by status</h6><canvas id="chStatus" height="200"></canvas></div></div>
    <div class="col-lg-6"><div class="card-x"><h6 class="fw-bold">Monthly complaints</h6><canvas id="chMonth" height="200"></canvas></div></div>
    <div class="col-lg-6"><div class="card-x"><h6 class="fw-bold">Area-wise complaints (top 10)</h6><canvas id="chArea" height="200"></canvas></div></div>
  </div>
</section>
<section id="sec-complaints" class="d-none">
  <div class="card-x mb-3"><div class="row g-2">
    <div class="col-md-3"><input id="aSearch" class="form-control" placeholder="Search text or ID…"></div>
    <div class="col-md-2"><select id="aCat" class="form-select"></select></div>
    <div class="col-md-2"><select id="aStatus" class="form-select"></select></div>
    <div class="col-md-2"><select id="aDept" class="form-select"></select></div>
    <div class="col-md-2"><input id="aLoc" class="form-control" placeholder="Location / ward"></div>
    <div class="col-md-1 d-grid"><button id="aClear" class="btn btn-outline-navy"><i class="bi bi-x-lg"></i></button></div>
  </div></div>
  <div class="card-x"><div class="table-responsive"><table class="table table-hover mb-0"><thead><tr><th>ID</th><th>Title</th><th>Citizen</th><th>Category</th><th>Location</th><th>Priority</th><th>Department</th><th>Status</th><th>Date</th><th></th></tr></thead><tbody id="aRows"></tbody></table></div></div>
</section>
<section id="sec-ml" class="d-none"><div id="mlBody"><div class="muted">Loading…</div></div></section>
  </main>
</div>
<div class="modal fade" id="cModal" tabindex="-1"><div class="modal-dialog modal-xl modal-dialog-scrollable"><div class="modal-content" style="border-radius:18px">
<div class="modal-header"><h5 class="modal-title fw-bold" id="mTitle"></h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
<div class="modal-body" id="mBody"></div></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script src="js/app.js"></script>
<script src="js/admin.js"></script>
</body></html>
