<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Complaints | Community Problem Platform</title>
<link rel="icon" href="images/logo.svg">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="sidebar" class="sidebar"></div>
<div class="app-main">
  <header class="topbar"><button class="menu-btn" id="menuBtn" aria-label="Menu"><i class="bi bi-list"></i></button>
  <h1 id="pageTitle">My Complaints</h1><div class="chip" id="userChip"></div></header>
  <main class="content">

<div class="card-x mb-4"><div class="row g-2">
  <div class="col-md-5"><input id="fSearch" class="form-control" placeholder="Search title, description or location…"></div>
  <div class="col-md-3"><select id="fCat" class="form-select"></select></div>
  <div class="col-md-3"><select id="fStatus" class="form-select"></select></div>
  <div class="col-md-1 d-grid"><button id="fClear" class="btn btn-outline-navy" title="Clear"><i class="bi bi-x-lg"></i></button></div>
</div></div>
<div class="row g-3" id="grid"></div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script src="js/complaints.js"></script>
</body></html>
