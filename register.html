<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign Up | Community Problem Platform</title><link rel="icon" href="images/logo.svg">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet"></head>
<body><div class="auth-wrap"><div class="auth-card" style="max-width:560px">
  <div class="brand"><img src="images/logo.svg" alt=""><span>Community Problem Platform</span></div>
  <h4 class="fw-bold mb-3">Create your citizen account</h4>
  <form id="regForm" novalidate><div class="row g-3">
    <div class="col-12"><label class="form-label">Full name</label><input class="form-control" name="full_name"></div>
    <div class="col-md-6"><label class="form-label">Email</label><input type="email" class="form-control" name="email"></div>
    <div class="col-md-6"><label class="form-label">Phone number</label><input class="form-control" name="phone" placeholder="10-digit number"></div>
    <div class="col-md-6"><label class="form-label">Password</label><input type="password" class="form-control" name="password"></div>
    <div class="col-md-6"><label class="form-label">Confirm password</label><input type="password" class="form-control" name="confirm_password"></div>
    <div class="col-12"><label class="form-label">Location</label><input class="form-control" name="location" placeholder="City / area"></div>
    <div class="col-12 d-grid"><button class="btn btn-green" id="btn">Sign up</button></div>
  </div></form>
  <div class="text-center mt-3 small">Already registered? <a href="login.html" class="fw-semibold">Login</a></div>
</div></div>
<script src="js/app.js"></script><script src="js/register.js"></script></body></html>
