<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login | Community Problem Platform</title><link rel="icon" href="images/logo.svg">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet"></head>
<body><div class="auth-wrap"><div class="auth-card">
  <div class="brand"><img src="images/logo.svg" alt=""><span>Community Problem Platform</span></div>
  <h4 class="fw-bold" id="title">Welcome back</h4>
  <div class="btn-group w-100 mb-3" role="group">
    <button type="button" class="btn btn-navy" id="tabCit">Citizen</button>
    <button type="button" class="btn btn-outline-navy" id="tabAdm">Administrator</button>
  </div>
  <form id="loginForm" novalidate>
    <label class="form-label">Email</label><input type="email" class="form-control mb-3" name="email" autocomplete="username">
    <label class="form-label">Password</label><input type="password" class="form-control mb-3" name="password" autocomplete="current-password">
    <button class="btn btn-green w-100" id="btn">Login</button>
  </form>
  <div class="text-center mt-3 small" id="reg">New here? <a href="register.html" class="fw-semibold">Create a citizen account</a></div>
  <div class="text-center mt-2 small"><a href="index.html" class="muted">&larr; Back to home</a></div>
</div></div>
<script src="js/app.js"></script><script src="js/login.js"></script></body></html>
