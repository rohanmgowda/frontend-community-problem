<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profile | Community Problem Platform</title>
<link rel="icon" href="images/logo.svg">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="sidebar" class="sidebar"></div>
<div class="app-main">
  <header class="topbar"><button class="menu-btn" id="menuBtn" aria-label="Menu"><i class="bi bi-list"></i></button>
  <h1 id="pageTitle">Profile</h1><div class="chip" id="userChip"></div></header>
  <main class="content">

<div class="row g-4">
 <div class="col-lg-6"><form id="pForm" class="card-x"><h5 class="fw-bold mb-3">Personal details</h5>
  <label class="form-label">Email</label><input class="form-control mb-3" id="pEmail" disabled>
  <label class="form-label">Full name</label><input class="form-control mb-3" name="full_name">
  <label class="form-label">Phone number</label><input class="form-control mb-3" name="phone">
  <label class="form-label">Location</label><input class="form-control mb-3" name="location">
  <button class="btn btn-green">Save changes</button></form></div>
 <div class="col-lg-6"><form id="pwForm" class="card-x"><h5 class="fw-bold mb-3">Change password</h5>
  <label class="form-label">Current password</label><input type="password" class="form-control mb-3" name="current_password">
  <label class="form-label">New password</label><input type="password" class="form-control mb-3" name="new_password">
  <label class="form-label">Confirm new password</label><input type="password" class="form-control mb-3" name="confirm_password">
  <button class="btn btn-navy">Update password</button></form></div>
 <div class="col-12"><div class="card-x"><div class="d-flex justify-content-between align-items-center mb-3"><h5 class="fw-bold mb-0">Complaint history</h5>
  <button class="btn btn-outline-navy btn-sm" id="pLogout"><i class="bi bi-box-arrow-right me-1"></i>Logout</button></div>
  <div class="table-responsive"><table class="table table-hover mb-0"><thead><tr><th>ID</th><th>Title</th><th>Category</th><th>Date</th><th>Status</th></tr></thead><tbody id="pHist"></tbody></table></div></div></div>
</div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script src="js/profile.js"></script>
</body></html>
